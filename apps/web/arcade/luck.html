<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가위바위보 챌린지 | FORGE5</title><link rel="stylesheet" href="../styles.css"></head><body><header class="nav"><a class="logo" href="../index.html">← FORGE5</a></header><main class="hero"><div class="eyebrow">FORGE5 ARCADE / DAILY EXPERIMENT</div><h1>가위바위보 챌린지</h1><p>0=가위, 1=바위, 2=보. 무작위 상대와 승부하세요.</p><section style="background:#172535;border:1px solid #456071;border-radius:14px;padding:30px;max-width:500px"><div id="display" style="font-size:42px;font-weight:900;margin:15px 0"></div><label for="answer">답변 입력</label><input id="answer" inputmode="numeric" type="number" style="font-size:20px;padding:12px;border-radius:8px;max-width:100%;background:#fff;color:#111"><button id="try" type="button" style="display:block;background:#a3f4bd;padding:12px 30px;border:0;border-radius:8px;margin-top:15px;font-weight:900">도전하기</button><p id="result" aria-live="polite"></p></section></main><script>const words=['가위','바위','보'];document.querySelector('#try').onclick=()=>{let a=Number(document.querySelector('#answer').value);if(!Number.isInteger(a)||a<0||a>2){document.querySelector('#result').textContent='0, 1, 2 중 선택하세요';return;}let b=Math.floor(Math.random()*3),result=(a-b+3)%3;document.querySelector('#result').textContent='나 '+words[a]+' / 상대 '+words[b]+' · '+(result===0?'비겼습니다':result===1?'승리!':'패배');};</script></body></html>
