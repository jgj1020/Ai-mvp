<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숫자 맞히기 챌린지 | FORGE5</title><link rel="stylesheet" href="../styles.css"></head><body><header class="nav"><a class="logo" href="../index.html">← FORGE5</a></header><main class="hero"><div class="eyebrow">FORGE5 ARCADE / DAILY EXPERIMENT</div><h1>숫자 맞히기 챌린지</h1><p>1~20의 숨겨진 숫자를 맞히세요.</p><section style="background:#172535;border:1px solid #456071;border-radius:14px;padding:30px;max-width:500px"><div id="display" style="font-size:42px;font-weight:900;margin:15px 0"></div><label for="answer">답변 입력</label><input id="answer" inputmode="numeric" type="number" style="font-size:20px;padding:12px;border-radius:8px;max-width:100%;background:#fff;color:#111"><button id="try" type="button" style="display:block;background:#a3f4bd;padding:12px 30px;border:0;border-radius:8px;margin-top:15px;font-weight:900">도전하기</button><p id="result" aria-live="polite"></p></section></main><script>let secret=1+Math.floor(Math.random()*20),count=0;document.querySelector('#try').onclick=()=>{let value=Number(document.querySelector('#answer').value);if(!Number.isInteger(value)||value<1||value>20){document.querySelector('#result').textContent='1~20을 입력하세요';return;}count++;document.querySelector('#result').textContent=value===secret?'성공! '+count+'번째 정답!':value<secret?'더 큰 수!':'더 작은 수!';if(value===secret)document.querySelector('#try').disabled=true;};</script></body></html>
